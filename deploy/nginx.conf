# ImageNova AI · nginx 站点配置
# 部署位置：/etc/nginx/conf.d/imagenova.conf （宿主机 sub2api-US）
# 证书：certbot webroot /var/www/letsencrypt，续期由 /etc/cron.d/xiaoshitanji-certbot 负责
# 后端：docker 容器 imagenova-ai，监听 127.0.0.1:8791 → 容器内 8787

server {
    listen 80;
    listen [::]:80;
    server_name image.papaclaoud.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name image.papaclaoud.top;

    ssl_certificate     /etc/letsencrypt/live/image.papaclaoud.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/image.papaclaoud.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    root  /opt/imagenova/dist;
    index index.html;

    # 生成接口可能较慢：单次出图超时 300s，反代留足余量
    location /api/ {
        proxy_pass         http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
